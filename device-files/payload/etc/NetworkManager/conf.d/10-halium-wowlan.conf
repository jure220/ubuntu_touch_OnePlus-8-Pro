# instantnoodlep: keep the wifi association alive across suspend.
#
# WHY THIS EXISTS
# ---------------
# Without WoWLAN configured, cfg80211 deliberately tears down every association
# when the system suspends. The symptom in the log is a deauth that our own side
# generated:
#
#     wpa_supplicant: wlan0: CTRL-EVENT-DISCONNECTED bssid=... reason=3 locally_generated=1
#
# followed by a full re-association and a fresh DHCP transaction on every resume.
# Measured over 3.5 h before this was set: 290 associations, 289 disconnects,
# 500 DHCP transactions of which 289 ended "no lease".
#
# That was survivable while the phone only suspended a few dozen times per boot.
# Once CONFIG_PM_AUTOSLEEP=y let repowerd suspend properly (PERFORMANCE-FINDINGS
# section 13) the phone began suspending ~750 times in 3.5 h, and the churn
# became the single largest source of wakeups, log volume and radio power draw.
#
# NOTE it is easy to miss this in NetworkManager's own logs: NM keeps the device
# in state "activated" while the supplicant flaps underneath, so `nmcli` reported
# only 2 activations over the same period that wpa_supplicant logged 290
# re-associations. Count wpa_supplicant's CTRL-EVENT lines, not NM's states.
#
# The qca6390 advertises full WoWLAN support:
#     * wake up on anything (device continues operating normally)
#     * wake up on disconnect
#     * wake up on magic packet
#     * pattern match, GTK rekeying, GTK rekey failure, ...
# but it defaults to disabled, and NM's own default (0x1 "default") leaves the
# driver default alone. So it has to be asked for explicitly.
#
# WHICH WoWLAN MODE, AND WHY NOT "magic"
# --------------------------------------
# 2 == NM_SETTING_WIRELESS_WAKE_ON_WLAN_ANY, which the driver describes as
# "wake up on anything (device continues operating normally)".
#
# This was first set to 8 (..._MAGIC). That fixed the association churn exactly
# as intended -- measured 41 suspends with ZERO disconnects and ZERO
# re-associations, same IP throughout -- but it made the phone unreachable over
# the network while asleep, and that is a functional loss, not just an
# inconvenience:
#
#   * the firmware answered ARP and ICMP on the host's behalf, so the phone
#     looked alive (ping 3/3) while no TCP connection could be established;
#   * only a magic packet could wake the CPU, so nothing else -- push
#     notifications, incoming connections -- could reach userspace until the
#     phone woke for some other reason;
#   * and because nothing in userspace holds a wakelock for network activity,
#     even a magic-packet wake re-suspended almost immediately, too fast to
#     service an incoming connection reliably.
#
# "any" keeps the association (which is the whole point of this file) and also
# lets ordinary traffic wake the CPU, at some cost in radio power. That trade-off
# was put to the device owner, who chose responsiveness over the last increment
# of battery life.
#
# If battery life later proves more important than being reachable while asleep,
# change this to 8 and expect the phone to stop answering anything but magic
# packets once the screen is off. Do NOT change it to 0/1/"default" -- that
# disables WoWLAN entirely and brings back the 290-re-associations-per-3.5h
# behaviour this file exists to prevent.
#
# This is set as a NetworkManager *connection default* rather than on one
# connection on purpose. Ubuntu Touch stores wifi via netplan and NM renders the
# connections into /run/NetworkManager/system-connections, which is tmpfs -- a
# per-connection `nmcli connection modify` therefore does NOT survive a reboot.
# A conf.d default applies to every wifi connection, including ones the user adds
# later, and lives in the read-only rootfs where it belongs.
#
# Development note: with "any" the phone wakes for ordinary traffic, so plain
# ssh reaches it again. A magic packet also still works and is worth keeping in
# mind if this is ever switched back to 8 --
#     python3 -c 'import socket;m=bytes.fromhex("00037ff2a798");s=socket.socket(
#       socket.AF_INET,socket.SOCK_DGRAM);s.setsockopt(socket.SOL_SOCKET,
#       socket.SO_BROADCAST,1);s.sendto(b"\xff"*6+m*16,("192.168.0.255",9))'
# (verified working; the phone answers ARP while asleep but will not wake for TCP.)

[connection]
wifi.wake-on-wlan = 2
