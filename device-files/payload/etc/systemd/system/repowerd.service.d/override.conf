# PROPER FIX (not a workaround): correct startup ordering.
#
# repowerd asks sensorfw for the proximity and light sensors at startup. Its
# stock unit orders only on lxc-android-config.service and dbus.socket, so on
# this device it starts BEFORE sensorfwd is ready and gives up permanently:
#
#   23:56:14  Starting repowerd.service
#   23:56:14  Starting sensorfwd.service
#   23:56:24  repowerd: Sensorfw: failed to call load_plugin: Timeout was reached
#   23:56:24  repowerd: Failed to create SensorfwLightSensor
#   23:56:34  repowerd: Failed to create SensorfwProximitySensor
#   23:56:49  Started sensorfwd.service        <- 15 s too late
#
# Consequences: no proximity (screen does not blank against your face during a
# call) and no ambient light sensor (no automatic brightness).
#
# sensorfwd.service is Type=notify, so systemd knows precisely when it is ready
# and After= genuinely waits for readiness rather than mere process start. That
# makes this a real ordering fix rather than a sleep-based bodge.
#
# NOT applied live on purpose: project rule 6 says never stop repowerd -- it
# blanks the screen unrecoverably. This takes effect on the next boot.
[Unit]
After=sensorfwd.service
Wants=sensorfwd.service
