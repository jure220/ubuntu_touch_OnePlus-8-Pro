[Service]
# Auto-brightness for the OnePlus 8 Pro (added 2026-09-02).
#
# Lomiri System Settings hides the "Adjust automatically" checkbox unless
# com.lomiri.Repowerd.getBrightnessParams() reports autobrightness supported.
# That comes from repowerd's device config, and stock Ubuntu Touch ships only
# config-default.xml with config_automatic_brightness_available=false and both
# auto-brightness arrays empty. There is no instantnoodlep override, so the
# toggle never appeared -- even though the panel, the ALS and OnePlus's own
# Android overlay all support it.
#
# repowerd reads its device configs from $REPOWERD_DEVICE_CONFIG_DIR. The
# obvious hook is the unit's EnvironmentFile=-/etc/default/repowerd, but
# /etc/default is not in /etc/system-image/writable-paths and is read-only on
# this image, so the variable is set here instead (/etc/systemd/system IS
# writable) and the config itself lives on /userdata.
#
# See device-files/repowerd/config-default.xml for how the brightness curve was
# derived from OnePlus's nits-based Android overlay.
Environment=REPOWERD_DEVICE_CONFIG_DIR=/usr/lib/halium/repowerd-device-configs
