[Service]
# This device registers two backlights under /sys/class/backlight, but
# panel1-backlight belongs to the secondary DSI interface (card0-DSI-2), which
# is disabled on the OnePlus 8 Pro.  repowerd enumerates the class directory and
# picks the last entry, so every brightness change landed on the dead panel and
# the slider appeared to do nothing.  Hide it so repowerd finds only panel0,
# which is also the node the Android lights HAL drives.
InaccessiblePaths=/sys/class/backlight/panel1-backlight
