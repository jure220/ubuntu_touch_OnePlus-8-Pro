[Unit]
# Start when armed.  Either flag is enough ("|" makes these two conditions an
# OR):
#   /userdata/.enable-android   one-shot arming, consumed by the wrapper unless
#                               autostart is set (see the note in the wrapper)
#   /userdata/.android-autostart  start on every boot -- what the UI needs, and
#                               what the release installer creates
# Until 2026-09-23 only .enable-android was checked.  The development phone had
# both files, but a clean install from the release zip gets only
# .android-autostart, so the container never started, lightdm had no display
# HAL, and the phone sat on the boot logo.  Caught by a clean-install test.
ConditionPathExists=|/userdata/.enable-android
ConditionPathExists=|/userdata/.android-autostart

[Service]
ExecStart=
ExecStart=/usr/lib/halium/start-android-container-halium
