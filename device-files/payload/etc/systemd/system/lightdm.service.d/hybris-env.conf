[Service]
# libhybris' linker has only /system/lib64, /vendor/lib64, /odm/lib64 and the
# apex dirs baked in -- NOT /vendor/lib64/egl where eglSubDriverAndroid.so
# lives. This is libhybris' own supported knob.  In the user session only
# pulseaudio gets it (pulseaudio.service.d/20-halium-hybris.conf); see there for
# why it must not be global.
Environment=HYBRIS_LD_LIBRARY_PATH=/usr/lib/halium/hybris-libs:/vendor/lib64/egl:/vendor/lib64/hw:/vendor/lib64:/system/lib64:/odm/lib64
