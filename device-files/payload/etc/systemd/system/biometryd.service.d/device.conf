[Service]
# Fingerprint for the OnePlus 8 Pro (added 2026-09-02).
#
# biometryd shipped MASKED on this port (a /dev/null symlink dated Jan 2 1970),
# because there was no fingerprint HAL at all and it exited 78 every start.
# There is one now, so it is unmasked -- but stock `biometryd run` with no
# --config still failed with:
#     Failed to instantiate device.
# and exited EX_CONFIG(78), leaving the daemon on the bus with ZERO objects
# (`gdbus introspect / --recurse` -> empty), so System Settings showed nothing.
#
# Without a config biometryd asks ConfigurationOracle to guess, which reads
# ro.product.device (= "kona" here) and, finding no match in its lookup table,
# is supposed to fall back to the "android" device. That fallback does not work
# here. Naming the device explicitly does.
#
# The config key is "id", NOT "name" -- biometryd looks up
# default_device["id"] in the device registry. Every "name"-based config is
# accepted by the JSON parser and then silently produces no device, which is
# why this looked like a broken backend for so long. `biometryd list-devices`
# prints the valid ids ("android", "Plugin", "Dummy").
#
# The android backend itself was never broken. Verified independently by
# dlopening it by hand through libhybris:
#     android_dlopen("libbiometry_fp_api.so")   -> ok
#     android_dlsym("u_hardware_biometry_new")  -> ok
#     u_hardware_biometry_new()                 -> valid handle
#     logcat: "Connected to IBiometricsFingerprint::2.3 service"
#
# /etc/default and /etc/biometryd are not writable on this image, so the config
# lives on /userdata (see device-files/biometryd/biometryd.json).
ExecStart=
ExecStart=/usr/bin/biometryd run --config=/usr/lib/halium/biometryd.json
