[Service]
ExecStart=
ExecStart=/usr/lib/halium/mount-android-partitions-fast
# Bind locally built library fixes over the read-only Android image, now that
# /android exists and before anything that uses it. Leading "-" so a failure
# here can never fail the mount unit; the script also always exits 0 itself.
ExecStartPost=-/usr/lib/halium/halium-android-overrides.sh
TimeoutStartSec=180
