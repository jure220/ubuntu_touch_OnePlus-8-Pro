# OnePlus 8 Pro (instantnoodlep) -- make call audio work.
#
# WHAT WAS BROKEN
# ---------------
# Voice calls connected (ofono said "active", the other side rang) but neither
# party could hear anything.  The Ubuntu Touch side was doing its job:
#
#   lomiri-telephony-service-handler[..]: Found card that supports voicecall: 'droid_card.primary'
#   lomiri-telephony-service-handler[..]: Setting PulseAudio card 'droid_card.primary' profile 'voicecall'
#
# and the Android audio HAL did enter call mode:
#
#   audio_hw_primary: adev_set_mode: mode 2 , prev_mode 0      <- 2 = AUDIO_MODE_IN_CALL
#
# ...but immediately after that, every voice session stayed inactive:
#
#   voice_extn: update_calls: cur_state=1 new_state=1 vsid=10c01000
#   voice_extn: update_calls: cur_state=1 new_state=1 vsid=11c05000     (etc, all 7 VSIDs)
#
# cur_state/new_state 1 is CALL_INACTIVE.  So the HAL never opened the voice
# PCM (VoiceMMode1) that carries modem <-> codec audio.  All that happened was
# that ordinary media playback got re-routed to the earpiece, because
# AUDIO_MODE_IN_CALL makes platform_get_output_snd_device() pick voice-handset.
# Hence: call connects, earpiece is selected, and the actual speech path is
# simply not running.
#
# WHY.  On Qualcomm HALs that include voice_extn (multi-SIM / VSID based, which
# is every modern one including kona/sm8250), adev_set_mode() does NOT start the
# call.  The call is started only when someone pushes
#
#     vsid=<hex>;call_state=2
#
# into the HAL via adev_set_parameters().  On stock Android that "someone" is
# qcrild: it registers vendor.qti.hardware.radio.am@1.0::IQcRilAudio/slot1 and
# then calls back into whoever registered an IQcRilAudioCallback with it, which
# on Android is the framework's audio service.
#
# Under Halium there is no Android framework, so Ubuntu Touch ships a stand-in:
# audiosystem-passthrough in "qti" mode.  It registers the IQcRilAudioCallback
# with qcrild and forwards whatever qcril sends into PulseAudio's droid module
# over PulseAudio's D-Bus socket (droid.set_parameters.v1), i.e. straight into
# the same HAL instance PulseAudio has open.  That is exactly the missing link.
#
# It was never starting.  Its ExecCondition is
# /usr/libexec/ubuntu-touch-session/check-for-iqcrilaudio, which is:
#
#     #!/bin/sh -e
#     grep -q IQcRilAudio /vendor/etc/vintf/*manifest*.xml /vendor/manifest.xml
#
# Two problems on this device:
#   1. /vendor/manifest.xml does not exist (it is an old pre-VINTF-fragment
#      path), so grep returns 2 and `sh -e` propagates it.
#   2. More importantly, this device declares IQcRilAudio in the *odm*
#      partition, /odm/etc/vintf/manifest.xml, which the check never looks at.
#      OnePlus splits vendor and odm; the stock check assumes everything is
#      under /vendor.
#
# Result at every boot:
#
#   check-for-iqcrilaudio[..]: grep: /vendor/manifest.xml: No such file or directory
#   audiosystem-passthrough-qti.service: Skipped due to 'exec-condition'.
#
# THE FIX
# -------
# Replace the ExecCondition with one that looks in the places this device
# actually uses.  The empty ExecCondition= first is required: for list-valued
# directives systemd *appends*, and an empty assignment is how you reset the
# list before setting a new value.
#
# Notes on the grep:
#   -q  exits 0 on the first match and, per GNU grep, a match still yields 0
#       even if some other argument could not be read -- so a non-existent
#       path in the list cannot cause a false negative.
#   -s  suppresses the "No such file or directory" noise in the journal for
#       the paths (and unmatched globs) that do not exist here.
#   /bin/sh -c is needed because systemd does not expand globs itself.
# The odm path is listed first so the common case short-circuits immediately.
#
# This is deliberately written as a generic path fix rather than
# ExecCondition=/bin/true: if a future rootfs ships a corrected
# check-for-iqcrilaudio, or the manifest moves, this keeps doing the right
# thing instead of blindly starting a service that has nothing to talk to.

# A SECOND thing was wrong: even once it starts, this process needs to be told
# which binder instance to talk to, and it learns that from
# /etc/ofono/ril_subscription.conf -- where it only accepts a slot whose
# transport value literally begins "binder:name".  Ours said "transport=binder",
# so it found no slots and exited 2 in 24 ms.  Fixed in
# /usr/lib/halium/ofono/ril_subscription.conf (bind-mounted over /etc/ofono by
# halium-dynparts.sh); both halves are required.
#
# -v is deliberate.  Without it this process is completely silent, which is how
# the whole thing stayed invisible: a call would connect, PulseAudio would
# switch to the voicecall profile, nothing would log an error anywhere, and
# there would simply be no sound.  With -v the journal shows, per call,
#
#   IQcRilAudioCallback::setParameters slot1 vsid=0x11c05000;call_state=2
#
# which is the one line that says the call audio plumbing actually ran.  It is
# not chatty: gbinder logs ~10 lines at startup and then nothing until a call.
# ExecStart has to be cleared first for the same reason as ExecCondition.
#
# stdbuf -oL is not decoration.  This program writes its log with plain stdout
# calls, and under systemd stdout is a pipe, so glibc block-buffers it; the
# lines would sit in a 4 KB buffer for the life of the process and never reach
# the journal.  (Its *errors* go to stderr, which is unbuffered -- that is why
# the sibling -af unit's failure is visible in the journal and the -qti unit's
# verbose output was not, even with -v actually in argv.)  -oL forces line
# buffering so each line lands as it happens.

[Service]
ExecCondition=
ExecCondition=/bin/sh -c 'grep -qs IQcRilAudio /odm/etc/vintf/*manifest*.xml /vendor/etc/vintf/*manifest*.xml /vendor/manifest.xml /android/system/system_ext/etc/vintf/*manifest*.xml'
ExecStart=
ExecStart=/usr/bin/stdbuf -oL /usr/libexec/audiosystem-passthrough/audiosystem-passthrough -v
