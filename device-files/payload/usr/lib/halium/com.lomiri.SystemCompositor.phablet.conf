<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The shipped com.lomiri.SystemCompositor.conf grants send access to these
  interfaces ONLY to user="root"; the default context gets Introspectable only.
  But lomiri-system-compositor runs as root while the SHELL runs as phablet
  (uid 32011), so every call the shell makes is refused:

    dbus-daemon: Rejected send message, 1 matched rules;
      sender (uid=32011 comm="lomiri --mode=full-greeter")
      interface="com.lomiri.SystemCompositor.Input" member="setMouseCursorSpeed"
      destination="com.lomiri.SystemCompositor.Input" (uid=0 lomiri-system-compositor)

  These interfaces exist precisely so the shell can drive input/display/power on
  the system compositor, so the shell user must be allowed to call them.
-->
<busconfig>
	<!-- numeric uid: phablet lives in extrausers, so a name lookup here may
       not resolve inside dbus -->
	<policy user="32011">
		<allow send_destination="com.lomiri.SystemCompositor.Display"
		       send_interface="com.lomiri.SystemCompositor.Display"/>
		<allow send_destination="com.lomiri.SystemCompositor.Input"
		       send_interface="com.lomiri.SystemCompositor.Input"/>
		<allow send_destination="com.lomiri.SystemCompositor.PowerButton"
		       send_interface="com.lomiri.SystemCompositor.PowerButton"/>
		<allow send_destination="com.lomiri.SystemCompositor.UserActivity"
		       send_interface="com.lomiri.SystemCompositor.UserActivity"/>
	</policy>
	<policy user="108">
		<allow send_destination="com.lomiri.SystemCompositor.Display"
		       send_interface="com.lomiri.SystemCompositor.Display"/>
		<allow send_destination="com.lomiri.SystemCompositor.Input"
		       send_interface="com.lomiri.SystemCompositor.Input"/>
		<allow send_destination="com.lomiri.SystemCompositor.PowerButton"
		       send_interface="com.lomiri.SystemCompositor.PowerButton"/>
		<allow send_destination="com.lomiri.SystemCompositor.UserActivity"
		       send_interface="com.lomiri.SystemCompositor.UserActivity"/>
	</policy>
</busconfig>
