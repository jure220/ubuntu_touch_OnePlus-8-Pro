# console-setup.service failed on EVERY boot of a clean install from the stock
# UBports 24.04-2.x rootfs (build #104):
#
#   setupcon: /etc/console-setup is not writable.  No files will be saved there.
#   /usr/bin/setupcon: cannot create /etc/console-setup/cached_UTF-8_del.kmap.gz:
#       Read-only file system
#
# /lib/console-setup/console-setup.sh only skips work when
# cached_setup_terminal.sh is strictly NEWER than /etc/default/console-setup.
# In that image both carry the same mtime (the rootfs build wrote them in the
# same second), so the cache always looks stale and `setupcon --save` tries to
# rewrite it on Ubuntu Touch's read-only root.  (The development phone never
# showed this only because its rootfs had been upgraded in place while
# writable, which left the cache newer.)
#
# Apply the settings without saving: the cache cannot be written here anyway,
# and the cached files the image ships are already the right ones.
[Service]
ExecStart=
ExecStart=/bin/sh -c '[ -f /etc/default/locale ] && . /etc/default/locale; export LANG; exec /bin/setupcon'
