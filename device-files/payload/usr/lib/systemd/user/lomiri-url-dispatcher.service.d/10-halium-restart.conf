# On a clean 24.04-2.x install lomiri-url-dispatcher failed at every login:
#     lomiri-url-dispatcher: failed to set up overlay tracker
# ayatana-indicator-datetime D-Bus-activates it ~6 s before
# graphical-session.target is reached, and the unit's After=graphical-session.target
# does not hold back a D-Bus activation, so it starts before the session it
# needs exists and exits 1.  Started any later it runs fine.  Retry instead of
# staying failed (a single early failure used to leave the unit dead until the
# next activation request).
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=20

[Service]
Restart=on-failure
RestartSec=3
