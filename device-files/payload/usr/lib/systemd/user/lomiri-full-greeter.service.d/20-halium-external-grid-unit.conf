[Service]
# Grid unit (px) for an external monitor attached to the phone, read by our
# qtmir build (device-files/qtmir-external-grid-unit.patch).  Upstream fixes
# it at 8, which on the 45" 3440x1440 test monitor made panel icons ~14 px --
# the charging battery lost its bolt and read as a bare green block.  9 was
# chosen by eye on that monitor (12, 11 and 10 were all too big).  The
# phone's own panel is unaffected; it keeps GRID_UNIT_PX from deviceinfo.
Environment=EXTERNAL_GRID_UNIT_PX=9
