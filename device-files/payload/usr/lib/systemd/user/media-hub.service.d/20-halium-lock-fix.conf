[Service]
# Run the media-hub-server built by build-media-hub/ (upstream 3b69471, the
# revision of the installed package, plus patches/0001) instead of the
# packaged /usr/bin/media-hub-server.
#
# The packaged binary leaks repowerd's "media-hub-playback_lock": when a
# video session is torn down mid-playback it requests the system lock and
# releases it in the same instant, before repowerd has replied; the release
# finds no cookie yet and does nothing, and the cookie that arrives next is
# never cleared.  repowerd then keeps /sys/power/autosleep "off" and the
# phone never deep-sleeps again until media-hub restarts.
#
# D-Bus activation goes through SystemdService=media-hub.service, so this
# drop-in covers both start paths.  AppArmor is not enabled on this kernel,
# so the profile keyed on /usr/bin/media-hub-server is not a concern.
ExecStart=
ExecStart=/usr/lib/halium/media-hub-server
