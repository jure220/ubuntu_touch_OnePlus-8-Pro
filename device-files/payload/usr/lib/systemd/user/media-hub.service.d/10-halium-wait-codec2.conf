[Service]
# Start media-hub only once halium-swcodec.sh has brought up the Android codec2
# software store (android.hardware.media.c2 IComponentStore/software).
#
# media-hub picks its video backend by scanning GStreamer plugins, and
# libgsthybris.so blocks in getService() for that store.  If media-hub starts
# first -- always on a fresh install, where there is no registry cache yet --
# the scan times out, GStreamer blacklists the plugin in
# ~/.cache/gstreamer-1.0/registry.aarch64.bin, and media-hub runs with
#     No video backend selected. Video functionality won't work.
# for good.  halium-mediahub-backend.sh used to repair that after the fact.
#
# The marker is written when halium-swcodec.sh finishes, whatever the outcome,
# so this can only delay media-hub, never block it; 150 s is a backstop.
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e /run/halium-codec2-ready ] && [ $i -lt 150 ]; do sleep 1; i=$((i+1)); done; exit 0'
TimeoutStartSec=200
