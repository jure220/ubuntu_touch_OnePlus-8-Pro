[Service]
# The audio HAL (audio.primary.kona.so) pulls in the vendor's libgui1_vendor.so,
# which was built against the Android 11 libui and needs symbols Android 14's
# /system/lib64/libui.so no longer has (HdrCapabilities, ui::Size::INVALID).
# /usr/lib/halium/hybris-libs carries a matching libui (and the other vendor-era
# libs), so it must come first on libhybris' search path -- for PulseAudio ONLY.
#
# Do NOT set this globally (environment.d, the user manager, /etc/environment):
# Android 14 system libraries need the NEW libui, and with this path media-hub's
# GStreamer scan of libgsthybris.so failed to link libgui.so
# (GraphicBufferMapper::setDataspace & co.), libhybris aborted, and the plugin
# was blacklisted -- no video playback or recording.
#
# Without this, pulseaudio aborts on every start:
#     linker_tls.cpp:93: unregister_tls_module CHECK 'mod.static_offset == SIZE_MAX' failed
# (libhybris crashing while unloading the half-linked HAL), trips the start
# limit, and the phone has no sound.  The proper fix is working linker
# namespaces (linkerconfig currently aborts: no com.android.vndk.v30 APEX).
Environment=HYBRIS_LD_LIBRARY_PATH=/usr/lib/halium/hybris-libs:/vendor/lib64/egl:/vendor/lib64/hw:/vendor/lib64:/system/lib64:/odm/lib64
