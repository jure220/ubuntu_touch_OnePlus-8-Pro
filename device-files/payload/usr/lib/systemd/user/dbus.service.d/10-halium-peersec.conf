# WORKAROUND, labelled as one -- source and full rationale in
# device-files/mediahub-shim/dbus-peersec.c.
#
# media-hub identifies D-Bus clients by the session bus's LinuxSecurityLabel
# (getsockopt SO_PEERSEC).  On this port every Ubuntu-side process has the
# SELinux label "kernel", which media-hub cannot parse
#     apparmor::lomiri::Context: Invalid profile name kernel
# and it then SEGVs on EVERY OpenUri, so nothing plays (re-verified on the
# 24.04-2.x b104 rootfs).  The shim reports "unconfined" for SO_PEERSEC only;
# every other getsockopt goes straight to the kernel.  No confinement is lost:
# none works on this port.  If AppArmor labels are ever made to work, remove
# this drop-in, or it will silently defeat them.
#
# This lived only in the development phone's home directory before.
[Service]
Environment=LD_PRELOAD=/usr/lib/halium/dbus-peersec.so
